<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tabliczka">
<title>Tabliczka mnożenia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Same look as Literki: notebook paper, Fredoka/Nunito, blue accent */
:root{
  --paper:#FBFAF5;--line:#DCE6F2;--margin:#F1B8B8;--ink:#1D2B4A;--muted:#5D6A82;
  --tile:#FFFFFF;--tile-edge:#C9D3E3;--accent:#2F5BD3;--accent-ink:#FFFFFF;--hl:#FFE36E;
  --ok:#1E8A55;--ok-soft:#DDF3E6;--bad:#C2413B;--bad-soft:#FBE3E1;
  --display:"Fredoka","Nunito",system-ui,sans-serif;--body:"Nunito",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#141B2B;--line:#222C42;--margin:#5A2E35;--ink:#E8EDF7;--muted:#9AA6BD;
  --tile:#1D2639;--tile-edge:#34405A;--accent:#7FA0F7;--accent-ink:#0E1424;--hl:#8A7420;
  --ok:#5BCF92;--ok-soft:#163626;--bad:#F08A84;--bad-soft:#3D1D1D;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  background-image:repeating-linear-gradient(to bottom,transparent 0 31px,var(--line) 31px 32px)}
main{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:20px;
  border-left:2px solid var(--margin);min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{font-family:var(--display);font-weight:600;font-size:1.6rem;margin:0}
a.back{font-weight:700;color:var(--accent);text-decoration:none;font-size:.95rem}
.lbl{margin:0 0 -12px;text-align:center;font-size:.78rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.chips button{padding:7px 0;width:44px;font-size:1rem;border-color:var(--tile-edge);color:var(--muted)}
.chips button.wide{width:auto;padding:7px 12px}
.chips button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.status{display:flex;justify-content:space-between;gap:12px;font-weight:700;font-variant-numeric:tabular-nums;margin-bottom:-12px}
.status .g{color:var(--ok)}.status .b{color:var(--bad)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar>span{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.card{display:flex;flex-direction:column;gap:18px;align-items:center;text-align:center;padding-block:8px}
.task{font-family:var(--display);font-weight:600;font-size:3.4rem;line-height:1.1;margin:0;font-variant-numeric:tabular-nums}
.ans{font-family:var(--display);font-weight:600;font-size:2.2rem;text-align:center;width:160px;padding:8px 12px;
  border:2px dashed var(--accent);border-radius:12px;background:var(--tile);color:var(--ink);outline:none;caret-color:var(--accent)}
.ans:focus{border-style:solid;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
.ans.ok{border:2px solid var(--ok);background:var(--ok-soft);color:var(--ok)}
.ans.bad{border:2px solid var(--bad);background:var(--bad-soft);color:var(--bad)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:360px}
.choices button{font-family:var(--display);font-weight:600;font-size:1.8rem;padding:12px 10px;border:2px solid var(--tile-edge);
  background:var(--tile);color:var(--ink);border-radius:12px}
.choices button:disabled{cursor:default}
.choices button.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.choices button.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.msg{min-height:1.6em;font-weight:700;margin:0;font-size:1.1rem}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
button{font:inherit;font-weight:700;border-radius:10px;padding:11px 18px;cursor:pointer;border:2px solid var(--accent);background:transparent;color:var(--accent)}
button.main{background:var(--accent);color:var(--accent-ink)}
button:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
.sumbig{font-family:var(--display);font-weight:600;font-size:3rem;margin:0;font-variant-numeric:tabular-nums}
.pl{font-size:1.15rem;color:var(--muted);margin:0}
.list{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.list span{font-family:var(--display);font-weight:600;padding:4px 10px;border-radius:8px;background:var(--bad-soft);color:var(--bad)}
.spk{padding:6px 14px;font-size:.95rem;border-color:var(--tile-edge);color:var(--muted)}
.rankform{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%}
.rankform input{font:inherit;font-weight:700;min-width:0;flex:1 1 160px;max-width:240px;padding:10px 12px;border-radius:10px;border:2px solid var(--tile-edge);background:var(--tile);color:var(--ink)}
.rankbox{background:var(--tile);border:1px solid var(--tile-edge);border-radius:12px;padding:12px 14px}
.rankbox summary{cursor:pointer;font-weight:700}
.rank{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.rank li{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;background:var(--paper);font-variant-numeric:tabular-nums}
.rank li.me{outline:2px solid var(--accent)}
.rank .pos{width:2em;text-align:center;font-weight:700}
.rank .nm{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:700}
.rank .sc{color:var(--muted);white-space:nowrap}
.whorow{display:flex;justify-content:flex-end;margin-top:-12px}
.who{font:inherit;font-weight:700;font-size:.92rem;padding:6px 12px;border-radius:999px;border:1px solid var(--tile-edge);background:var(--tile);color:var(--ink);cursor:pointer}
.namein{font:inherit;font-size:1.3rem;text-align:center;padding:10px 14px;border-radius:10px;border:2px solid var(--accent);background:var(--tile);color:var(--ink);max-width:100%;width:280px}
.hint{color:var(--muted);font-size:.9rem;margin:0;text-align:center}
@media (prefers-reduced-motion:no-preference){.pop{animation:pop .25s ease-out}@keyframes pop{50%{transform:scale(1.08)}}}
</style>
</head>
<body>
<main>
  <header>
    <h1>✖️ Tabliczka mnożenia</h1>
    <a class="back" href="/">← Menu</a>
  </header>
  <div class="whorow"><button type="button" id="whoBtn" class="who" hidden></button></div>

  <form class="card" id="nameBox" hidden autocomplete="off">
    <p class="pl" style="color:var(--ink);font-size:1.3rem;font-family:var(--display)">Jak masz na imię?</p>
    <input id="nameIn" class="namein" maxlength="20" placeholder="Wpisz imię" aria-label="Imię">
    <button class="main" type="submit">Zaczynamy!</button>
  </form>

  <div id="app" hidden style="display:flex;flex-direction:column;gap:20px">
  <p class="lbl">Zakres</p>
  <div class="chips" id="ranges">
    <button type="button" class="wide" data-range="50" aria-pressed="true">Do 50</button>
    <button type="button" class="wide" data-range="100" aria-pressed="false">Całość (do 100)</button>
  </div>

  <p class="lbl">Rodzaj gry</p>
  <div class="chips" id="modes">
    <button type="button" class="wide" data-mode="type" aria-pressed="true">Wpisz</button>
    <button type="button" class="wide" data-mode="choice" aria-pressed="false">Wybierz</button>
  </div>

  <div id="game">
    <div class="status"><span id="qpos"></span><span><span class="g" id="good">0</span> · <span class="b" id="bad">0</span></span></div>
    <div class="bar" aria-hidden="true" style="margin-top:20px"><span id="prog"></span></div>

    <section class="card" id="card" style="margin-top:20px">
      <p class="task" id="task"></p>
      <button type="button" class="spk" id="spkBtn" aria-label="Przeczytaj działanie">🔊 Przeczytaj</button>
      <form id="typeBox" autocomplete="off">
        <input class="ans" id="ans" inputmode="numeric" pattern="[0-9]*" maxlength="3" aria-label="Wynik">
      </form>
      <div class="choices" id="choiceBox" hidden></div>
      <p class="msg" id="msg"></p>
      <div class="row">
        <button class="main" id="checkBtn" type="button">Sprawdź</button>
        <button id="nextBtn" type="button">Pomiń</button>
      </div>
    </section>
  </div>

  <section class="card" id="summary" hidden>
    <p class="pl">Koniec rundy</p>
    <p class="sumbig" id="sumBig"></p>
    <p class="msg ok" id="sumMsg"></p>
    <p class="pl" id="wrongHead" hidden>Te działania były źle:</p>
    <div class="list" id="wrongList"></div>
    <p class="pl" id="sumTime"></p>
    <div class="row">
      <button class="main" id="repWrong">Powtórz złe</button>
      <button id="newRound">Nowa runda</button>
    </div>
    <form class="rankform" id="rankForm" hidden autocomplete="off">
      <button class="main" type="submit" id="rankSend">🏆 Dodaj do rankingu</button>
    </form>
    <p class="hint" id="rankMsg" hidden></p>
  </section>

  <details class="rankbox" id="rankBox">
    <summary>🏆 Ranking</summary>
    <div class="chips" id="rankTabs" style="margin-top:12px">
      <button type="button" class="wide" data-rr="50">Do 50</button>
      <button type="button" class="wide" data-rr="100">Całość (do 100)</button>
    </div>
    <ol class="rank" id="rankList"></ol>
    <p class="hint" id="rankInfo"></p>
  </details>

  </div>

  <p class="hint">Marcin Lechowicz</p>
</main>

<script>
// Round settings
const ROUND = 10;
let range = 50;              // 50 = products up to 50, 100 = whole table
let mode = 'type';
let queue = [], idx = 0, good = 0, bad = 0, wrong = [], answered = false, timer = null;
let startedAt = 0, elapsed = 0, ranked = false, rankable = false;

const $ = id => document.getElementById(id);
const KEY = 'tabliczka-v1';
try { const d = JSON.parse(localStorage.getItem(KEY) || 'null'); if (d) { if (d.range === 100) range = 100; if (d.mode === 'choice') mode = 'choice'; } } catch (e) {}
function saveSettings(){ try { localStorage.setItem(KEY, JSON.stringify({ range, mode })); } catch (e) {} }

// ---- Polish speech ----
function speak(text){
  try {
    const u = new SpeechSynthesisUtterance(text); u.lang = 'pl-PL'; u.rate = 0.95;
    const v = speechSynthesis.getVoices().find(x => x.lang && x.lang.toLowerCase().startsWith('pl')); if (v) u.voice = v;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch (e) {}
}
function sayTask(){ if (idx < queue.length){ const [a, b] = queue[idx]; speak(`${a} razy ${b}`); } }

function renderToggles(){
  document.querySelectorAll('#ranges button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.range === range)));
  document.querySelectorAll('#modes button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === mode)));
}
document.querySelectorAll('#ranges button').forEach(b => b.onclick = () => { range = +b.dataset.range; saveSettings(); renderToggles(); newRound(); });
document.querySelectorAll('#modes button').forEach(b => b.onclick = () => { mode = b.dataset.mode; saveSettings(); renderToggles(); newRound(); });

function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

// Tasks a x b with a,b in 1..10 and product within the selected range (skip trivial x1 when possible)
function makeQueue(){
  let pool = [];
  for (let a = 1; a <= 10; a++) for (let b = 1; b <= 10; b++) if (a * b <= range) pool.push([a, b]);
  const harder = pool.filter(([a, b]) => a > 1 && b > 1);
  if (harder.length >= ROUND) pool = harder;
  shuffle(pool);
  return pool.slice(0, ROUND);
}

function startRound(tasks, isRepeat){
  clearTimeout(timer); timer = null;
  queue = tasks; idx = 0; good = 0; bad = 0; wrong = []; ranked = false;
  rankable = !isRepeat && mode === 'type' && tasks.length === ROUND;
  startedAt = 0; elapsed = 0;
  $('summary').hidden = true; $('game').hidden = false; $('rankForm').hidden = true; $('rankMsg').hidden = true;
  showTask();
}
function newRound(){ startRound(makeQueue(), false); }

function showTask(){
  if (idx >= queue.length) return finish();
  if (!startedAt) startedAt = Date.now();
  answered = false;
  const [a, b] = queue[idx];
  $('task').textContent = `${a} × ${b} = ?`;
  $('qpos').textContent = `Pytanie ${idx + 1} / ${queue.length}`;
  $('good').textContent = good; $('bad').textContent = bad;
  $('prog').style.width = (idx / queue.length * 100) + '%';
  $('msg').textContent = ''; $('msg').className = 'msg';
  $('nextBtn').textContent = 'Pomiń';
  const typing = mode === 'type';
  $('typeBox').hidden = !typing; $('checkBtn').hidden = !typing; $('choiceBox').hidden = typing;
  if (typing){
    const inp = $('ans'); inp.value = ''; inp.className = 'ans'; inp.disabled = false; inp.focus();
  } else buildChoices(a * b);
  sayTask();
}

// Four options: correct plus nearby plausible results
function buildChoices(res){
  const [a, b] = queue[idx];
  const opts = new Set([res]);
  const cands = [res + a, res - a, res + b, res - b, res + 1, res - 1, res + 10, res - 10].filter(x => x > 0);
  shuffle(cands);
  for (const c of cands){ if (opts.size >= 4) break; opts.add(c); }
  while (opts.size < 4) opts.add(res + opts.size * 2);
  const box = $('choiceBox'); box.innerHTML = '';
  shuffle([...opts]).forEach(v => {
    const btn = document.createElement('button');
    btn.type = 'button'; btn.textContent = v;
    btn.onclick = () => {
      if (answered) return;
      box.querySelectorAll('button').forEach(x => { x.disabled = true; if (+x.textContent === res) x.classList.add('ok'); });
      if (v !== res) btn.classList.add('bad');
      judge(v === res);
    };
    box.appendChild(btn);
  });
}

function check(){
  if (answered) return next();
  const inp = $('ans'), v = inp.value.trim();
  if (v === '') { inp.focus(); return; }
  const [a, b] = queue[idx];
  const ok = +v === a * b;
  inp.className = 'ans ' + (ok ? 'ok' : 'bad'); inp.disabled = true;
  judge(ok);
}

const praise = ['Super! 🎉', 'Brawo! ⭐', 'Świetnie! 👏', 'Dobrze! ✅', 'Ekstra! 🚀'];
function judge(ok){
  answered = true;
  const [a, b] = queue[idx];
  const m = $('msg');
  if (ok){
    good++; m.textContent = praise[Math.floor(Math.random() * praise.length)]; m.className = 'msg ok pop';
    timer = setTimeout(next, 900);
  } else {
    bad++; wrong.push([a, b]);
    m.textContent = `${a} × ${b} = ${a * b}`; m.className = 'msg bad pop';
    $('nextBtn').textContent = 'Dalej';
    speak(`${a} razy ${b} to ${a * b}`);
  }
  $('good').textContent = good; $('bad').textContent = bad;
}

function next(){
  clearTimeout(timer); timer = null;
  if (!answered){ bad++; wrong.push(queue[idx]); }
  idx++; showTask();
}

function fmtTime(sec){ const s = Math.round(sec); return s < 60 ? `${s} s` : `${Math.floor(s / 60)} min ${s % 60} s`; }

function finish(){
  elapsed = startedAt ? (Date.now() - startedAt) / 1000 : 0;
  $('prog').style.width = '100%';
  $('game').hidden = true; $('summary').hidden = false;
  $('sumBig').textContent = `${good} / ${queue.length}`;
  const pct = good / queue.length;
  $('sumMsg').textContent = pct === 1 ? 'Bezbłędnie! 🏆' : pct >= .7 ? 'Bardzo dobrze! 💪' : 'Ćwicz dalej, dasz radę! 🙂';
  $('sumTime').textContent = `Czas: ${fmtTime(elapsed)} · zakres: ${range === 50 ? 'do 50' : 'całość'}`;
  $('wrongHead').hidden = wrong.length === 0;
  $('repWrong').hidden = wrong.length === 0;
  $('wrongList').innerHTML = wrong.map(([a, b]) => `<span>${a} × ${b} = ${a * b}</span>`).join('');
  // Ranking only for full rounds in "Wpisz" mode
  const rm = $('rankMsg');
  if (RANK.url && rankable && !ranked){ $('rankForm').hidden = false; rm.hidden = true; }
  else if (RANK.url && !rankable && mode === 'choice'){ $('rankForm').hidden = true; rm.hidden = false; rm.textContent = 'Do rankingu liczą się rundy w trybie „Wpisz”.'; }
  else { $('rankForm').hidden = true; rm.hidden = true; }
}

$('typeBox').onsubmit = e => { e.preventDefault(); check(); };
$('checkBtn').onclick = check;
$('nextBtn').onclick = next;
$('spkBtn').onclick = sayTask;
$('newRound').onclick = newRound;
$('repWrong').onclick = () => startRound(shuffle([...wrong]), true);

/* ---- shared online ranking (Supabase, table math_scores) ---- */
const RANK = { url: 'https://gmrkbgttpmyutjetotqb.supabase.co', key: 'sb_publishable_YY9S71fMeWZBeNvc7QrDww_A_SQ6PKc' };
const RR_LABEL = { 50: 'Do 50', 100: 'Całość (do 100)' };
let rankReq = 0, rankNext = null;
function rankHeaders(){ return RANK.key.startsWith('eyJ') ? { apikey: RANK.key, Authorization: 'Bearer ' + RANK.key } : { apikey: RANK.key }; }
let nameCleared = false;
function playerName(){
  try { const n = localStorage.getItem('tabliczka-name'); if (n) return n; if (n === '' || nameCleared) return ''; } catch (e) {}
  try { const d = JSON.parse(localStorage.getItem('literki-v1') || 'null'); if (d && d.name) return d.name; } catch (e) {}
  return '';
}
async function loadRank(r){
  document.querySelectorAll('#rankTabs button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.rr === r)));
  const l = $('rankList'), info = $('rankInfo'), my = ++rankReq; l.innerHTML = ''; info.textContent = 'Wczytuję…';
  try {
    const res = await fetch(RANK.url + '/rest/v1/math_scores?select=name,good,total,seconds&upto=eq.' + r + '&limit=3000', { headers: rankHeaders() });
    if (!res.ok) throw new Error(res.status);
    const rows = await res.json(); if (my !== rankReq) return; l.innerHTML = '';
    const best = {};
    rows.forEach(x => {
      const k = x.name.trim().toLowerCase(), b = best[k], sec = +x.seconds;
      if (!b || x.good > b.good || (x.good === b.good && sec < b.sec)) best[k] = { name: x.name.trim(), good: x.good, total: x.total, sec };
    });
    const top = Object.values(best).sort((a, b) => b.good - a.good || a.sec - b.sec).slice(0, 10);
    const medal = ['🥇', '🥈', '🥉'], me = playerName().trim().toLowerCase();
    let place = 0;
    top.forEach((x, i) => {
      if (i === 0 || x.good !== top[i - 1].good || Math.round(x.sec) !== Math.round(top[i - 1].sec)) place = i + 1;
      const li = document.createElement('li'); if (x.name.toLowerCase() === me) li.className = 'me';
      const a = document.createElement('span'); a.className = 'pos'; a.textContent = medal[place - 1] || String(place);
      const n = document.createElement('span'); n.className = 'nm'; n.textContent = x.name;
      const sc = document.createElement('span'); sc.className = 'sc'; sc.textContent = `${x.good}/${x.total} · ${fmtTime(x.sec)}`;
      li.append(a, n, sc); l.appendChild(li);
    });
    info.textContent = top.length ? 'Liczy się najlepszy wynik każdej osoby: najpierw punkty, przy remisie krótszy czas.' : `Brak wyników w zakresie „${RR_LABEL[r]}”. Bądź pierwszy!`;
  } catch (e) { if (my !== rankReq) return; info.textContent = 'Nie udało się wczytać rankingu. Sprawdź połączenie z internetem.'; }
}
$('rankForm').onsubmit = async e => {
  e.preventDefault();
  const name = playerName().trim().slice(0, 20);
  if (!name){ showName(); return; }
  const btn = $('rankSend'); btn.disabled = true; btn.textContent = 'Wysyłam…';
  try {
    const res = await fetch(RANK.url + '/rest/v1/math_scores', { method: 'POST',
      headers: Object.assign({ 'Content-Type': 'application/json', Prefer: 'return=minimal' }, rankHeaders()),
      body: JSON.stringify({ name, upto: range, good, total: queue.length, seconds: Math.max(1, Math.round(elapsed * 10) / 10) }) });
    if (!res.ok) throw new Error(res.status);
    ranked = true; $('rankForm').hidden = true;
    const m = $('rankMsg'); m.hidden = false; m.textContent = 'Dodano do rankingu! Zobacz niżej.';
    const box = $('rankBox'); if (box.open) loadRank(range); else { rankNext = range; box.open = true; }
  } catch (e) { btn.textContent = 'Nie udało się. Spróbuj ponownie'; }
  btn.disabled = false; if (!ranked) setTimeout(() => { btn.textContent = '🏆 Dodaj do rankingu'; }, 2500); else btn.textContent = '🏆 Dodaj do rankingu';
};
$('rankBox').addEventListener('toggle', () => { if ($('rankBox').open){ loadRank(rankNext || range); rankNext = null; } });
document.querySelectorAll('#rankTabs button').forEach(b => b.onclick = () => loadRank(+b.dataset.rr));

// ---- player name (asked first, like Literki) ----
function showName(){
  const n = playerName(), has = !!n;
  $('nameBox').hidden = has; $('app').hidden = !has; $('whoBtn').hidden = !has;
  if (has) $('whoBtn').textContent = '👤 ' + n + ' · zmień';
  else { clearTimeout(timer); timer = null; $('nameIn').value = ''; setTimeout(() => $('nameIn').focus(), 50); }
}
$('nameBox').onsubmit = e => {
  e.preventDefault();
  let n = $('nameIn').value.trim().slice(0, 20);
  if (!n){ $('nameIn').focus(); return; }
  n = n.charAt(0).toUpperCase() + n.slice(1);
  try { localStorage.setItem('tabliczka-name', n); } catch (e) {}
  showName(); newRound();
};
$('whoBtn').onclick = () => { try { localStorage.setItem('tabliczka-name', ''); } catch (e) {} nameCleared = true; showName(); };

renderToggles();
showName();
if (playerName()) newRound();
</script>
</body>
</html>
